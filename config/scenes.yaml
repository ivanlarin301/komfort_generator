# Prompts for Codex image generation (FR-4, FR-5).
#
# Main mode "scene" (design D1-v2): Codex generates the product from the operator's photo (attached as a
# reference) inside a professionally lit scene. Inside a batch, items of one category rotate through
# `surfaces` and `scenes`, so the cards do not repeat. The owner may edit these texts freely.
#
# Fallback mode "composite" (layout.mode = composite): an empty background from `style` + `bans`, and the
# product cut out of the photo is placed on it by the template.

scene_style: >-
  Professional commercial product photograph for a vertical 4:5 Instagram advertisement (1080x1350).
  Use the attached photo only as the product reference and recreate exactly this product: {product}.
  Keep its real shape and proportions, colours, cap and handles, label layout, logo and the large brand
  and product-name lettering, and render it as a real three-dimensional object, not a flat cut-out.
  The product stands on {surface}, {scene}. It is in the centre of the frame, occupying about 55-65% of
  the frame height, with its base at about 75% of the frame height; the camera is slightly above the
  product with a natural perspective. Modern, stylish studio lighting: a soft key light from the upper
  left, a gentle rim light, a realistic contact shadow and soft reflections on the surface; shallow depth
  of field with a softly blurred background; slightly dark, premium mood. Keep the top 25% and the bottom
  20% of the frame calm and darker, without important details: text will be added there later.
scene_bans: >-
  Do not add any other text, letters, numbers, logos, price tags, stickers, watermarks or borders.
  No people, no hands, no other products or packaging.

style: >-
  Photorealistic background photo for a vertical 4:5 product advertisement card (1080x1350).
  {scene}. In the centre foreground there is an empty, clearly visible {surface} where a product
  will be placed later; keep that central area completely empty. Camera at about the height of the
  product, looking slightly down, natural perspective. Soft key light from the upper left, realistic
  materials, slightly dark and moody tones, shallow depth of field: the background behind the surface
  is softly blurred. The top 30% and the bottom 20% of the frame are calm and darker, with no
  important details.
bans: >-
  No products, no packaging, no boxes or bags in the foreground, no people, no hands, no text, no
  letters, no numbers, no logos, no signs, no watermarks, no frames or borders.

categories:
  dry_mix:
    label: "Сухие смеси, клеи, штукатурки, наливные полы"
    scenes:
      - "in a room under renovation with bare grey plaster walls and stacked ceramic tiles far in the blurred background"
      - "in a new apartment being finished, with a mixing bucket and trowels far in the blurred background"
      - "in a bright interior under renovation with a freshly tiled wall far in the blurred background"
    surfaces: ["a dusty concrete floor", "a wooden pallet", "a large ceramic floor tile", "a rough plywood board"]
  paint:
    label: "Краски, эмали, грунтовки, лаки, антисептики"
    scenes:
      - "in a freshly painted room with a drop cloth, a stepladder and paint rollers far in the blurred background"
      - "on a wooden terrace by a country house, warm evening light, garden far in the blurred background"
      - "in a carpentry workshop with planks and tools on the wall far in the blurred background"
    surfaces: ["a rough dark wooden workbench", "weathered wooden deck boards", "a light birch plywood sheet", "a concrete floor with a few paint drops"]
  boards:
    label: "Утеплитель, плиты, гипсокартон, OSB, фанера, кровля"
    scenes:
