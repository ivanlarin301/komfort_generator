[project]
name = "komfort-cards"
version = "0.1.0"
description = "Карточки товаров «Комфорт» в дизайне Canva: фото + таблица + фон Codex → готовые PNG 1080×1350"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pillow>=10.4",
    "playwright>=1.45",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
# The project is run as `python -m komfort_cards` from the repository root; it is not installed as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "browser: tests that render through Microsoft Edge / Chromium (slower)",
]
